<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Secure Login System
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:
linear-gradient(
135deg,
#051225,
#0d2745
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

color:white;

}

.dashboard{

width:1100px;

background:
rgba(
255,
255,
255,
0.05
);

backdrop-filter:
blur(20px);

padding:40px;

border-radius:25px;

box-shadow:
0 0 50px
rgba(
0,
255,
255,
0.15
);

}

.header{

text-align:center;

margin-bottom:30px;

}

.header h1{

font-size:42px;

color:#00d5ff;

}

.header p{

margin-top:10px;

color:#cbd5e1;

}

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:25px;

}

.card{

background:
rgba(
255,
255,
255,
0.06
);

padding:25px;

border-radius:18px;

}

input{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:10px;

}

button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:10px;

background:#00b7ff;

color:white;

cursor:pointer;

}

button:hover{

opacity:.9;

}

.status{

margin-top:20px;

padding:18px;

border-radius:12px;

background:#071221;

}

.success{

color:#00ff88;

}

.error{

color:#ff4d4d;

}

.info{

line-height:32px;

margin-top:20px;

}

.toggle{

display:flex;

align-items:center;

gap:10px;

margin-top:20px;

}

.logout{

background:#ff4d4d;

}

.footer{

margin-top:30px;

text-align:center;

color:#9ca3af;

}

</style>

</head>

<body>

<div class="dashboard">

<div class="header">

<h1>
🔐 Secure Login System
</h1>

<p>
Cyber Security Internship – Task 4
</p>

</div>

<div class="grid">

<div class="card">

<h2>
Register
</h2>

<input
id="regUser"
placeholder="Username">

<input
id="regPass"
type="password"
placeholder="Password">

<div class="toggle">

<input
type="checkbox"
id="twofa">

<label>
Enable 2FA
</label>

</div>

<button
onclick="register()">

Create Account

</button>

<div
class="status"
id="registerStatus">

Waiting...

</div>

</div>

<div class="card">

<h2>
Secure Login
</h2>

<input
id="loginUser"
placeholder="Username">

<input
id="loginPass"
type="password"
placeholder="Password">

<button
onclick="login()">

Login

</button>

<button
class="logout"
onclick="logout()">

Logout

</button>

<div
class="status"
id="loginStatus">

Waiting...

</div>

<div
class="info">

✔ Password Hashing (bcrypt concept)  
<br>

✔ Input Validation  
<br>

✔ SQL Injection Protection  
<br>

✔ Session Management  
<br>

✔ Optional 2FA  

</div>

</div>

</div>

<div class="footer">

Secure Authentication • Protected Sessions • Secure Access

</div>

</div>

<script>

let users=
JSON.parse(
localStorage.getItem(
"secureUsers"
)
)
||
[];

let active=
localStorage.getItem(
"session"
);

function fakeHash(text){

return btoa(
text
);

}

function register(){

let user=
document
.getElementById(
"regUser"
)
.value
.trim();

let pass=
document
.getElementById(
"regPass"
)
.value;

let twofa=
document
.getElementById(
"twofa"
)
.checked;

if(
user.length<3
){

showRegister(
"Username minimum 3 characters",
true
);

return;

}

if(
pass.length<8
){

showRegister(
"Password minimum 8 characters",
true
);

return;

}

if(
/('|--|;|DROP|SELECT)/i
.test(
user
)
){

showRegister(
"Invalid input detected",
true
);

return;

}

let exists=
users.find(
u=>u.user===user
);

if(
exists
){

showRegister(
"User already exists",
true
);

return;

}

users.push({

user,

pass:
fakeHash(
pass
),

twofa

});

localStorage.setItem(

"secureUsers",

JSON.stringify(
users

)

);

showRegister(
"Account Created Securely",
false
);

}

function login(){

let user=
document
.getElementById(
"loginUser"
)
.value;

let pass=
document
.getElementById(
"loginPass"
)
.value;

let found=
users.find(

u=>

u.user===user
&&

u.pass===fakeHash(
pass
)

);

if(
found
){

localStorage.setItem(
"session",
user
);

let msg=
"Login Successful";

if(
found.twofa
){

msg+=
" | 2FA Enabled";

}

showLogin(
msg,
false
);

}

else{

showLogin(
"Invalid Credentials",
true
);

}

}

function logout(){

localStorage.removeItem(
"session"
);

showLogin(
"Logged Out",
false
);

}

function showRegister(
msg,
err
){

let box=
document
.getElementById(
"registerStatus"
);

box.innerHTML=
msg;

box.className=

err

?

"status error"

:

"status success";

}

function showLogin(
msg,
err
){

let box=
document
.getElementById(
"loginStatus"
);

box.innerHTML=
msg;

box.className=

err

?

"status error"

:

"status success";

}

if(
active
){

showLogin(
"Active Session: "
+
active,
false
);

}

</script>

</body>

</html>
